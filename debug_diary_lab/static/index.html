<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI记生成调试</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Diary Debug Lab</p>
          <h1>AI记过零点调试小站</h1>
          <p>独立 SQLite，不碰正式聊天记录、长期记忆和日记。</p>
        </div>
        <button id="resetButton" class="ghost-button">清空调试数据</button>
      </section>

      <section class="toolbar">
        <label>
          当前模拟日期
          <input id="currentDateInput" type="date" />
        </label>
        <button id="changeDayButton">切到选中日期并触发生成</button>
        <button id="manualGenerateButton" class="secondary">生成当前选中日期 AI记</button>
        <span id="statusText"></span>
      </section>

      <section class="grid">
        <article class="panel">
          <div class="panel-head">
            <h2>聊天框</h2>
            <span id="selectedDateTag"></span>
          </div>
          <div id="chatList" class="chat-list"></div>
          <form id="chatForm" class="chat-form">
            <input id="messageInput" placeholder="输入一句调试聊天内容" />
            <button>发送</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>日历</h2>
            <span id="monthLabel"></span>
          </div>
          <div class="calendar-week">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
          <p class="hint">蓝点=有聊天，绿点=已生成 AI记，橙点=待生成。</p>
        </article>

        <article class="panel diary-panel">
          <div class="panel-head">
            <h2>AI记</h2>
            <span id="diaryStatus"></span>
          </div>
          <pre id="diaryContent"></pre>
        </article>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
