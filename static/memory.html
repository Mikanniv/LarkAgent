<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-api-base" content="https://api.irises.me" />
    <title>云雀长期记忆库</title>
    <link rel="stylesheet" href="styles.css?v={{asset_version}}" />
  </head>
  <body class="memory-page">
    <div class="noise noise-left"></div>
    <div class="noise noise-right"></div>

    <main class="memory-shell">
      <header class="memory-header">
        <div>
          <p class="eyebrow">Yunque Memory</p>
          <h1>记忆库-调试页面</h1>
          <p class="hero-copy">输入 query 后查看 ChromaDB 的 top-k 召回结果、召回分、语义距离、重要度和元数据。</p>
        </div>
        <a class="secondary-button" href="./?view=chat">返回聊天页</a>
      </header>

      <section class="panel memory-debug-panel">
        <form class="memory-form" id="memoryForm">
          <label>
            <span>Query</span>
            <textarea id="memoryQuery" rows="3"></textarea>
          </label>
          <div class="memory-controls">
            <label>
              <span>Top-k</span>
              <input id="memoryK" type="number" min="1" max="50" value="3" />
            </label>
            <label>
              <span>User ID</span>
              <input id="memoryUserId" type="text" value="local_user" />
            </label>
            <label>
              <span>类型</span>
              <select id="memoryType">
                <option value="">全部</option>
                <option value="preference">preference</option>
                <option value="relationship">relationship</option>
                <option value="routine">routine</option>
                <option value="event">event</option>
                <option value="summary">summary</option>
              </select>
            </label>
            <button class="send-button" type="submit">召回</button>
          </div>
        </form>
      </section>

      <section class="memory-result-head">
        <div>
          <h2 id="memoryResultTitle">等待查询</h2>
          <p class="panel-copy" id="memoryResultMeta">当前还没有召回结果。</p>
        </div>
        <div class="memory-actions">
          <button class="primary-button" id="memoryListButton" type="button">查看最近记忆</button>
          <button class="danger-button" id="memoryClearButton" type="button">清空当前筛选</button>
        </div>
      </section>

      <section class="memory-result-grid" id="memoryResults"></section>
    </main>

    <script src="memory.js?v={{asset_version}}"></script>
  </body>
</html>
