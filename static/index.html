<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-api-base" content="https://worker.lark.irises.me" />
    <title>云雀</title>
    <link rel="stylesheet" href="styles.css?v={{asset_version}}" />
  </head>
  <body>
    <section class="intro-screen" id="introScreen">
      <div class="intro-card">
        <img class="intro-logo" src="branding/lark-icon.png" alt="" />
        <h1>云雀</h1>
        <p>理解每一次交流，也让记忆保持可靠。</p>
        <button class="button button-primary" id="enterAppButton" type="button">进入云雀</button>
        <button class="auth-trigger" id="authToggleButton" type="button">登录 / 注册</button>
        <form class="auth-popover" id="authForm" hidden>
          <input id="authUsername" autocomplete="username" placeholder="用户名" />
          <input id="authPassword" autocomplete="current-password" type="password" placeholder="密码（至少 8 位）" />
          <div class="button-row">
            <button class="button button-primary" id="authLoginButton" type="submit">登录</button>
            <button class="button" id="authRegisterButton" type="button">注册</button>
          </div>
          <p id="authStatus">请先登录或注册。</p>
        </form>
      </div>
    </section>

    <main class="app-shell is-hidden" id="appShell">
      <aside class="main-sidebar" id="appSidebar">
        <header class="brand-row">
          <span class="brand-logo"><img src="branding/lark-icon.png" alt="" /></span>
          <strong>云雀</strong>
          <button class="icon-button sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起侧边栏">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
          </button>
        </header>
        <nav class="main-nav">
          <button class="nav-item is-active" id="sidebarChatTab" data-view="chat" type="button">
            <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" /></svg>
            <span>聊天</span>
          </button>
          <button class="nav-item" id="sidebarDiaryTab" data-view="diary" type="button">
            <svg viewBox="0 0 24 24"><path d="M5 4a2 2 0 0 1 2-2h12v18H7a2 2 0 0 0-2 2zM5 4v18M9 7h6M9 11h6" /></svg>
            <span>日记</span>
            <span class="new-badge" id="diaryNewBadge" hidden>NEW</span>
          </button>
          <button class="nav-item" id="sidebarMemoryTab" data-view="memory" type="button">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" /></svg>
            <span>记忆</span>
            <span class="new-badge" id="memoryNewBadge" hidden>NEW</span>
          </button>
          <button class="nav-item" id="sidebarSettingsTab" data-view="settings" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3A1.7 1.7 0 0 0 14 21v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9A1.7 1.7 0 0 0 21 10h.2v4H21a1.7 1.7 0 0 0-1.6 1z" /></svg>
            <span>设置</span>
          </button>
        </nav>
      </aside>
      <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭菜单"></button>

      <section class="workspace">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobileSidebarToggle" type="button" aria-label="打开菜单">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <h2 id="activeViewTitle">聊天</h2>
          <span class="backend-state" id="backendStatus"><i></i>离线</span>
        </header>

        <section class="view-stack">
          <section class="app-view chat-view is-active" id="chatView">
            <article class="chat-panel">
              <header class="chat-header">
                <div>
                  <strong>云雀</strong>
                  <span id="agentStatus">文本陪伴模式</span>
                </div>
                <aside class="emotion-widget is-collapsed" id="emotionWidget">
                  <button class="emotion-toggle" id="emotionToggle" type="button" aria-expanded="false" title="展开情绪画像">
                    <svg viewBox="0 0 24 24"><path d="M4 15l4-4 4 3 5-7 3 2" /><path d="M4 19h16" /></svg>
                    <span>情绪画像</span>
                    <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
                  </button>
                  <div class="emotion-content">
                    <div class="score-card">
                      <span>单模态 · 文本</span>
                      <strong id="textScore">0.000</strong>
                    </div>
                    <div class="score-card">
                      <span>融合得分</span>
                      <strong id="fusionScore">0.000</strong>
                    </div>
                    <div class="score-card">
                      <span>单模态 · 语音</span>
                      <strong id="audioScore">--</strong>
                    </div>
                  </div>
                </aside>
              </header>

              <div class="chat-list" id="chatList"></div>

              <form class="composer" id="chatForm">
                <textarea id="messageInput" rows="2" placeholder="和云雀说点什么……"></textarea>
                <button class="voice-button" id="voiceButton" type="button" aria-label="开始录音" title="发送语音">
                  <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
                </button>
                <button class="send-button" type="submit" aria-label="发送">
                  <svg viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8-3-8zM7 12h14" /></svg>
                </button>
              </form>
            </article>
          </section>

          <section class="app-view" id="diaryView">
            <article class="surface diary-surface">
              <header class="section-header">
                <div>
                  <h3>日记与 AI记</h3>
                  <p>AI记在每三条观察生成后等待你的审查。</p>
                </div>
                <div class="segmented">
                  <button class="is-active" id="diaryUserModeTab" type="button">用户记</button>
                  <button id="diaryAiModeTab" type="button">AI记</button>
                </div>
              </header>

              <section class="diary-pane is-active" id="userDiaryPane">
                <div class="diary-editor-head">
                  <label>日期 <input id="userDiaryDate" type="date" /></label>
                  <span id="userDiaryStatus"></span>
                </div>
                <textarea id="userDiary" placeholder="记录今天想留下的事情……"></textarea>
                <div class="button-row align-end">
                  <button class="button" id="diaryDeleteButton" type="button">删除</button>
                  <button class="button button-primary" id="diarySaveButton" type="button">保存</button>
                </div>
              </section>

              <section class="diary-pane" id="aiDiaryPane">
                <div class="ai-diary-list" id="aiDiaryList"></div>
              </section>
            </article>
          </section>

          <section class="app-view" id="memoryView">
            <article class="surface memory-browser">
              <aside class="memory-layers" id="memoryLayers"></aside>
              <aside class="memory-items" id="memoryItems"></aside>
              <section class="memory-detail" id="memoryDetail">
                <div class="empty-state">
                  <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" /></svg>
                  <p>选择一条记忆查看详情</p>
                </div>
              </section>
            </article>
          </section>

          <section class="app-view" id="settingsView">
            <article class="surface settings-surface">
              <div class="setting-row">
                <div><strong>主动回复</strong><p>允许云雀在长时间无输入时主动发起一句陪伴。</p></div>
                <label class="switch"><input id="proactiveReplyToggle" type="checkbox" checked /><span></span></label>
              </div>
              <div class="setting-row">
                <div><strong>清空开发数据</strong><p>清除当前用户的聊天、日记和 v2.0 三层记忆。</p></div>
                <button class="button button-danger" id="clearDataButton" type="button">清空</button>
              </div>
            </article>
          </section>
        </section>
      </section>
    </main>

    <div class="modal-backdrop" id="revisionModal" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="revisionTitle">
        <h3 id="revisionTitle">修改观察</h3>
        <p>请直接写下你希望云雀保留的准确版本。</p>
        <textarea id="revisionInput" rows="6"></textarea>
        <div class="button-row align-end">
          <button class="button" id="revisionCancel" type="button">取消</button>
          <button class="button button-primary" id="revisionSubmit" type="button">提交修改</button>
        </div>
      </section>
    </div>

    <script src="app.js?v={{asset_version}}"></script>
  </body>
</html>
